# gitleaks' own rules, with what is not a secret set aside as narrowly as can be said. A real secret is removed and
# replaced, never listed here (AGENTS.md section 6).

[extend]
useDefault = true

[[allowlists]]
description = "Made-up values in tests, the same file tools/ci/secrets-allowed.txt names"
paths = [
    '''products/qq/tests/tst_agent\.cpp''',
]

# A catalogue's "key" is a developer's public key, there so anyone can check a signature: 65 bytes, a point on P-256 (checked
# 31 October 2026). Only that exact line in a catalogue: anything else in the same file is still looked at.
[[allowlists]]
description = "A developer's public key in the Store's catalogues"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''(^|/)catalog\.json$''',
]
regexTarget = "line"
regexes = [
    '''^\s*"key":\s*"[A-Za-z0-9+/]{87}=",?\s*$''',
]

# The startup manifest names token-definition files by path. These two values
# are their SHA-256 source hashes, recomputed by tools/branding/check_assets.py,
# not provider tokens. Match only these exact public lines in that manifest;
# another field, digest or path still reaches the default rules.
[[allowlists]]
description = "Two verified public source hashes in startup provenance"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
    '''(^|/)kit/branding/manifest\.json$''',
]
regexTarget = "line"
regexes = [
    '''^\s*"kit/Tokens\.qml":\s*"1a9c9a167eac444dccaf97e43232f096aef04624854726d4417a43937117a03b",?\s*$''',
    '''^\s*"kit/tokens/lumen\.tokens\.json":\s*"9717240bbbd228b457320064892304dd78f3c6b5fbc8596dd824a32dc4ec3818",?\s*$''',
]
