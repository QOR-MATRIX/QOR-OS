name: Bug report
description: Something in QOR OS behaves incorrectly, crashes, or regresses.
title: "[Bug] "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Include enough detail to reproduce the problem. Report vulnerabilities through the private security form. Remove credentials, personal identifiers and restricted third-party engine material from every attachment.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kit / Lumen design system
        - Lumen Qt Quick Controls style
        - Shell (Rail, Shelf, Beam, Control Center, windows)
        - Prism compositor
        - Services / simulator / qorctl
        - Apps
        - Platform theme / QStyle
        - Controllers and input
        - QQ (engine, Studio, Player)
        - ARQADE
        - QOR Media
        - QOR core / vault
        - Games (Steam, Proton, gamescope)
        - Displays (KMS backend, refresh rates, GPUs)
        - Image (Fedora Atomic, drivers, updates)
        - Q Pi / native ARM64
        - Build / CI / tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. qor-shell --unlocked --open files
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QOR OS commit or version
      placeholder: e.g. 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, GPU and graphics API (Settings › About shows the API), Qt version, preset.
      placeholder: Windows 11 · RTX 4060 · Direct3D 11 · Qt 6.12.0 · ci-windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Include the failing command, relevant output and any skips. Review and redact before attaching logs or captures; never include tokens, keys, passwords, sign-in links or email addresses.
      render: shell
